name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.15-native
          name: "Vạn Trần J2ME Native iOS v2.15"
          body: |
            ## Vạn Trần J2ME iOS v2.15 — Giữ Kết Nối Treo Nền Xuyên Suốt 24/7 & Ghim Thông Báo Cố Định Không Spam
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🌐 **Giữ Kết Nối Mạng Socket 24/7 Xuyên Suốt Không Ngắt Nghỉ**:
              - Gỡ bỏ hoàn toàn cờ `TCP_RXT_CONNDROPTIME` 10s (nguyên nhân chính khiến game bị ngắt kết nối sau 10s nghẽn/chuyển trạm sóng di động 4G/5G/Wi-Fi).
              - Tối ưu TCP Keep-Alive đa tầng (probe 20s, retry 10s, 8 lần = 80s chống rớt NAT di động).
              - Kích hoạt phân lớp ưu tiên luồng mạng thời gian thực `SO_TC_VO` (Voice/Interactive Realtime) ngăn iOS ngắt luồng dữ liệu game khi tắt màn hình.
            - 🛡️ **Khắc Phục Hoàn Toàn Lỗi Bị Kill App Sau ~1 Giờ Treo Máy**:
              - Kích hoạt đồng thời `AVAudioPlayer` (chạy sóng hạ âm 16Hz non-zero PCM trong `mediaserverd` hệ thống) kết hợp `AVAudioEngine AURemoteIO` 18Hz.
              - Cấu hình âm thanh `.mixWithOthers`, `.allowBluetooth`, `.allowBluetoothA2DP`, `.allowAirPlay` giúp app không bao giờ bị dừng khi đổi tai nghe hoặc có âm thanh hệ thống.
            - 📌 **Thông Báo Ghim Cố Định Âm Thầm (Passive Interruption) & Tự Động Xóa Khi Tắt App**:
              - Ghim thẻ trạng thái RAM/CPU/Tab cố định trên Màn Hình Khóa & Trung Tâm Thông Báo.
              - **Tuyệt đối không rơi banner popup**: Thiết lập `interruptionLevel = .passive` không chuông, không rung, không nháy màn hình.
              - **Tắt app là mất ngay**: Tự động xóa sạch thẻ thông báo ngay khi tắt/thoát app (Swipe up kill app) hoặc khi quay lại chơi game.
            - 🖥️ **Màn Hình Tự Động Kín 100%, Không Méo, Không Viền Đen**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

