name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.19-native
          name: "Vạn Trần J2ME Native iOS v2.19"
          body: |
            ## Vạn Trần J2ME iOS v2.19 — Khắc Phục Triệt Để Hiện Tượng Treo Đơ 57 Phút (17% CPU Spin & GC Deadlock)
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🛡️ **Khắc Phục Triệt Để Lỗi Treo Đơ Sau ~57 Phút (CPU 17% / 100% Core Spin)**:
              - **Chấm dứt Deadlock GC Stop-The-World**: Trong MiniJVM, cơ chế `_gc_pause_the_world` trước đây giữ `thread_list->spinlock` trong lúc chờ các luồng Java tạm dừng qua `vm_share_timedwait`. Khi có luồng Java kết thúc hoặc bắt đầu gọi `threadlist_remove`/`add`, luồng đó bị kẹt trong vòng lặp spinlock 100% CPU (chiếm đúng 16.7% ≈ 17% CPU của chip 6 nhân Apple A-series). Phiên bản v2.19 đã tạo bản sao an toàn (snapshot) danh sách luồng trước khi chờ và bổ sung cơ chế timeout 2.0s tự phục hồi, triệt tiêu hoàn toàn khả năng deadlock.
              - **Tối ưu Spinlock thích ứng & Nhường CPU**: Nâng cấp `spin_lock_count` trong `spinlock.h` với cơ chế `thrd_yield()` sau 64 chu kỳ tự xoay, ngăn chặn hiện tượng luồng chiếm dụng 100% một nhân CPU vô tận khi có tranh chấp tài nguyên.
              - **Khắc phục Vòng lặp Nhận Socket 0-Byte (Spurious EINTR Spin)**: Trong `sock_recv` (`jni_io.c`), các tín hiệu hệ thống ngắt (`EINTR`) trên socket chặn trước đây trả về mã 0 cho Java khiến vòng lặp đọc `DataInputStream.readFully()` quay cuồng với 100% CPU. Đã sửa để tự động retry an toàn và phát hiện đứt kết nối mạng nhà mạng (NAT timeout sau 1 tiếng) ngay lập tức.
            - 🎮 **Giao Diện "Chơi Game Tuổi Thơ" Chuẩn 1:1 Theo Ảnh Mẫu**:
              - Thẻ Game Card hiện đại: `v1.6.12 • 1.7 MB`, `[🔲] Tự Động`, huy hiệu `🟢 Đang Chạy` / `⚪️ Đã Dừng`.
              - Tiêu đề đếm số game: `Đang Chạy: X / Y Game` theo thời gian thực.
              - Thanh điều hướng 5 Tab: `Kho Game`, `Treo 24/7`, `Đang Chạy` (kèm badge đỏ), `Tài Khoản`, `Cài Đặt`.
              - Tùy chọn "Ẩn & Treo ngầm (Giữ game chạy 24/7)" khi bấm nút Quay lại (Back).
            - 📍 **Chế Độ Treo Định Vị BTS & Audio Chạy Ngầm 24/7 Không Nóng Máy**:
              - Duy trì kết nối mạng không bị iOS trảm, không tiêu tốn pin.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

