name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.17-native
          name: "Vạn Trần J2ME Native iOS v2.17"
          body: |
            ## Vạn Trần J2ME iOS v2.17 — Khắc Phục Triệt Để Đơ Màn Hình & Văng Game Khi Treo Lâu
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🛡️ **Khắc Phục Triệt Để Hiện Tượng Đơ Màn Hình Rồi Văng Ra Danh Sách (Fix Freeze & Auto-Reconnect)**:
              - **Chặn hoàn toàn lệnh tự thoát từ game mod**: Cả trong màn hình sáng lẫn chạy ngầm, giả lập chặn 100% lệnh `System.exit()` và `notifyDestroyed()` từ game mod nếu người chơi chưa bấm nút "Thoát / Back" trên Decade.
              - **Tự động vào lại game sau 2 giây (Auto-Reconnect)**: Nếu máy chủ game ngắt kết nối hoặc bảo trì, giả lập giữ nguyên màn hình và tự động khởi động lại game sau 2 giây để auto-login tiếp tục treo mà không văng ra ngoài.
              - **Tối ưu TCP Keep-Alive chống rớt sóng NAT**: Nâng thời gian chịu lỗi lên 11+ phút (660s) thay vì ngắt cưỡng bức ở 80s, loại bỏ socket filter class gây nghẽn kết nối của nhà mạng di động.
              - **Loại bỏ hiện tượng khựng/đơ khung hình định kỳ**: Tắt việc ép dọn RAM cưỡng bức mỗi 60s khi dung lượng RAM đang thấp (<150MB), giúp game chạy mượt 100% không bao giờ bị đơ giật khi treo lâu.
            - 📍 **Chế Độ Treo Định Vị BTS Tiết Kiệm Pin Tối Đa (0% Pin, Không Cần Audio)**:
              - Giữ kết nối ngầm bằng trạm sóng BTS di động (`kCLLocationAccuracyThreeKilometers`), TẮT HOÀN TOÀN chip GPS vệ tinh và TẮT HOÀN TOÀN audio keepalive để máy mát lạnh và tiết kiệm pin tối đa.
            - 📌 **Thông Báo Ghim Cố Định Âm Thầm & Tự Xóa Khi Tắt App**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

