name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.9-native
          name: "Vạn Trần J2ME Native iOS v2.9"
          body: |
            ## Vạn Trần J2ME iOS v2.9 — Smart Network & Instant Setup Engine
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - ⚡ **Cập nhật Thiết lập Setup ngay lập tức**:
              - Thêm menu **⚙️ Thiết lập & Cài đặt (Áp dụng ngay)** trực tiếp trong game.
              - Mọi thay đổi cấu hình (kích thước, tỷ lệ, toàn màn hình, bàn phím, độ mờ, ẩn nút, proxy) được lưu và cập nhật trực tiếp vào game đang chạy tức thì mà không cần thoát ra hay khởi động lại!
              - Cơ chế ghi file và lưu RMS trong Java/J2ME được `fflush` và `fsync` ngay lập tức, đảm bảo lưu cấu hình game, tài khoản và dữ liệu không bị mất.
            - 🚀 **Tối ưu tốc độ mạng & Up mượt**:
              - Kích hoạt `TCP_NODELAY` loại bỏ hoàn toàn độ trễ đóng gói (Nagle's delay), gói tin gửi lên máy chủ phản hồi siêu nhạy và mượt mà.
              - Mở rộng socket buffer lên 64KB, kích hoạt `SO_NOSIGPIPE` chống crash mạng trên iOS.
            - 📶 **Chuyển mạng thông minh (Smart Network Handover)**:
              - Tự động phát hiện và chuyển luồng liền mạch giữa **Wi-Fi** và **5G / 4G Dữ liệu di động** (và ngược lại) qua `NWPathMonitor` và `SO_FALLBACK_INTERFACE` của Apple Darwin.
              - Giữ kết nối game không bị ngắt quãng khi mất sóng Wi-Fi.
            - 🛡️ **Treo nền tắt màn hình 24/7 không mất kết nối & không bị kill app**:
              - Sửa triệt để cơ chế gia hạn `beginBackgroundTask`, chống bị iOS watchdog kill app (`0xbaadca11`).
              - Tự động ngắt render GPU màn hình khi tắt màn hình/khoá máy giúp tiết kiệm 95% CPU, không lo bị iOS Jetsam kill do quá tải tài nguyên.
              - Luồng âm thanh giữ nhịp chạy nền liên tục với `AVAudioSession` độc quyền và tự phục hồi sau cuộc gọi/thông báo.
            - 💬 **Bong bóng Messenger Chat Heads & Cửa sổ nổi PiP**: Kéo thả, co giãn tự do, chuyển đổi 1 chạm mượt mà.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly hoặc 3uTools.
          files: J2ME-Decade.ipa

