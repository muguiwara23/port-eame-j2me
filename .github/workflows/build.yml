name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.10-native
          name: "Vạn Trần J2ME Native iOS v2.10"
          body: |
            ## Vạn Trần J2ME iOS v2.10 — Cập Nhật Setup Tức Thì & Tối Ưu UX Mượt Mà
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - ⚡ **Cập nhật Thiết lập Setup Trong Game Ngay Lập Tức (Auto Nhóm, Tiện Ích, Config)**:
              - Khắc phục triệt để lỗi thiết lập: Sửa bug ChoiceGroup (Radio/Checkbox) trong Java J2ME bị reset về rỗng khi bấm Lưu.
              - Cơ chế đồng bộ hóa toàn diện (`syncAllTextFields`): Toàn bộ textfield (danh sách tên mời nhóm, khoảng cách, cài đặt) được đẩy tức thời vào bộ nhớ native và Java trước khi thực thi lệnh Lưu.
              - Cập nhật giao diện ChoiceGroup tại chỗ mượt mà 120 FPS không giật lag, không hủy vẽ lại form, không làm mất con trỏ soạn thảo hay văng bàn phím.
              - Mở khóa chuyển màn hình game `Display.setCurrent(canvas)` sau khi lưu: Cho phép game quay lại Canvas tức thì (hỗ trợ cả Thread ngầm, TimerTask, `callSerially`, phản hồi mạng RMS).
              - Mở rộng bộ đệm form và text box lên 8KB với rào cản bộ nhớ `atomic_thread_fence`, không còn hiện tượng tràn bộ đệm hay đọc sót dữ liệu giữa các luồng.
            - 🖐️ **Tối ưu thao tác người dùng (UX Optimization)**:
              - Tích hợp phản hồi rung xúc giác chân thực (Haptic Feedback) khi chạm nút bấm, checkbox, radio button.
              - Bàn phím gõ tiếng Việt (Telex/VNI) đồng bộ tức thì, hỗ trợ nút "✓ Xong" đóng bàn phím thông minh.
              - Nâng kích thước hàng đợi sự kiện `INPUT_QUEUE_SIZE` lên 1024 sự kiện, loại bỏ hiện tượng nuốt nút khi thao tác nhanh.
            - 🚀 **Tối ưu tốc độ mạng Up mượt**:
              - Kích hoạt `TCP_NODELAY` loại bỏ trễ Nagle, gửi nhận gói tin tức thời không độ trễ.
              - Mở rộng socket buffer 64KB, `SO_NOSIGPIPE`, `SO_KEEPALIVE` giữ luồng mạng sống ổn định.
            - 📶 **Chuyển mạng thông minh (Smart Network Handover)**:
              - Tự động luân chuyển luồng dữ liệu giữa **Wi-Fi** và **5G / 4G Dữ liệu di động** liền mạch qua `SO_FALLBACK_INTERFACE` của Darwin.
            - 🛡️ **Treo nền tắt màn hình 24/7 không lo mất kết nối hay văng app**:
              - Chế độ giữ nhịp âm thanh tần số thấp vô thanh liên tục với quyền `.playback` + `.mixWithOthers`.
              - Ngắt render đồ họa khi màn hình khoá/chạy nền giúp tiết kiệm 95% CPU, chống bị iOS Jetsam kill.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

