name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.8-native
          name: "Vạn Trần J2ME Native iOS v2.8"
          body: |
            ## Vạn Trần J2ME iOS v2.8 — Native Multi-Tab Engine
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - **Chuẩn Bong bóng Messenger (Chat Heads) 1-chạm**:
              - **Bong bóng Logo thuần tuý**: Khi thu nhỏ, chỉ có DUY NHẤT 1 logo game tròn nhỏ nổi trên màn hình (không có khung cửa sổ bao quanh), di chuyển tự do khắp màn hình, tự động hít vào mép như Messenger.
              - **Chạm 1 chạm vào logo**: Lập tức bung ra Cửa sổ nhỏ tuỳ chỉnh kích thước (kéo góc ◢ hoặc thu phóng 2 ngón tay tuỳ ý).
              - **Chạm 1 chạm vào thanh tiêu đề hoặc nút 💬 / ✕ trên cửa sổ**: Lập tức ẩn cửa sổ và biến lại thành đúng mỗi cái logo game nhỏ nổi trên màn hình.
            - **Ngoài màn hình chính (PiP)**: Đã ẩn toàn bộ các nút điều khiển video (Play, tua 10s, thanh tiến trình) của Apple để cửa sổ phát game trực tiếp sạch sẽ.
            - **Dọn dẹp sạch sẽ 100% credit cũ**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly hoặc 3uTools.
          files: J2ME-Decade.ipa

