name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.16-native
          name: "Vạn Trần J2ME Native iOS v2.16"
          body: |
            ## Vạn Trần J2ME iOS v2.16 — Treo Định Vị BTS (0% Pin, Không Cần Audio) & Chống Out Game
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 📍 **Chế Độ Treo Định Vị BTS Tiết Kiệm Pin Tối Đa (0% Pin, Không Cần Âm Thanh)**:
              - Sử dụng chế độ chạy nền định vị trạm sóng di động BTS (`kCLLocationAccuracyThreeKilometers`).
              - **TẮT HOÀN TOÀN** chip phần cứng GPS vệ tinh (0% hao pin định vị vệ tinh).
              - **TẮT HOÀN TOÀN** âm thanh audio keepalive (`AVAudioPlayer` & `AVAudioEngine`), giải phóng hoàn toàn chip xử lý âm thanh DAC để tiết kiệm pin tối đa.
            - 🛡️ **Khắc Phục Triệt Để Lỗi Bị Out Game Về Danh Sách Khi Đang Treo (Anti-Dismiss & Anti-Exit)**:
              - **Chặn lệnh tự hủy khi ở nền**: Tự động bỏ qua lệnh `notifyDestroyed()` từ game mod khi app đang tắt màn hình/chạy ngầm, không để game tự đóng khi mạng lag hay timeout.
              - **Khóa tự đóng giao diện (Anti-Dismiss)**: Chỉ đóng game khi người dùng trực tiếp bấm nút "Thoát / Back". Không bao giờ tự động văng về màn hình danh sách ngoài.
              - **Bọc an toàn luồng sự kiện (Event Loop)**: Bọc `try-catch` toàn diện cho đồ họa và chống ngắt luồng `InterruptedException` khi dọn dẹp RAM/GC.
              - **Hộp thoại khôi phục game thông minh**: Nếu game dừng do mất kết nối máy chủ, giữ nguyên màn hình và hiển thị nút "Vào lại game ngay" tiện lợi.
            - 🌐 **Giữ Kết Nối Mạng Socket 24/7 Xuyên Suốt Không Ngắt Nghỉ**:
              - Tối ưu TCP Keep-Alive đa tầng và phân lớp thời gian thực `SO_TC_VO`.
            - 📌 **Thông Báo Ghim Cố Định Âm Thầm & Tự Xóa Khi Tắt App**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

