name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.1-native
          name: "Vạn Trần J2ME Native iOS v2.1"
          body: |
            ## Vạn Trần J2ME iOS v2.1 — Native Multi-Tab Engine
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - **Cửa sổ nổi ngoài màn hình (PiP - Đè ứng dụng khác)**: Cho phép hiển thị game trực tiếp đè lên mọi ứng dụng khác (Facebook, Safari, TikTok, Messenger...) hoặc màn hình chính ngoài Home Screen. Người dùng có thể di chuyển và thu phóng tự do.
            - **Cửa sổ màn hình nhỏ kéo to nhỏ tuỳ ý (Mini Window)**: Cửa sổ nổi mini bên trong ứng dụng, cho phép dùng 2 ngón tay thu phóng (pinch) hoặc kéo tay cầm góc dưới bên phải để phóng to / thu nhỏ kích thước tuỳ thích.
            - **Bong bóng nổi AssistiveTouch Popup**: Di chuyển tự do trên màn hình, chạm vào để mở Menu nhanh (Quay lại game, Bật PiP ra ngoài, Mở cửa sổ nhỏ, Màn hình đen OLED tiết kiệm pin, Chuyển tab, Gán proxy).
            - **Sửa giao diện ChoiceGroup (Dạng nút chọn Radio/Checkbox)**: Khắc phục triệt để lỗi hiện chuỗi chữ "1 Bật Tắt 0,1".
            - **Dọn dẹp sạch sẽ toàn bộ thông tin credit cũ**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi dùng Sideloadly hoặc 3uTools để cài lên iPhone.
          files: J2ME-Decade.ipa

