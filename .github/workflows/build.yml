name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.3-native
          name: "Vạn Trần J2ME Native iOS v2.3"
          body: |
            ## Vạn Trần J2ME iOS v2.3 — Native Multi-Tab Engine
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - **Cửa sổ nổi ngoài màn hình chính (PiP Wide)**: Tối ưu hoá tỷ lệ khung hình 4:3 cho phép cửa sổ nổi PiP ngoài màn hình chính có thể phóng to cực đại tràn ngang toàn bộ màn hình iPhone (từ ~140pt lên tới ~390pt) hoặc thu nhỏ tự do.
            - **Cách kéo to nhỏ ngoài màn hình chính**:
              1. **Dùng 2 ngón tay thu phóng (Pinch)**: Đặt 2 ngón tay lên cửa sổ nổi và kéo giãn ra để phóng to, bóp vào để thu nhỏ.
              2. **Chạm 2 lần (Double Tap)**: Chạm đúp 2 lần liên tiếp vào cửa sổ nổi để phóng to cực đại tràn viền hoặc thu nhỏ tức thì.
            - **Cửa sổ nhỏ trong ứng dụng (Mini Window)**: Có tay cầm kéo kích thước góc dưới và cử chỉ 2 ngón tay thu phóng.
            - **Bong bóng nổi AssistiveTouch**: Kéo thả tự do khắp màn hình.
            - **Dọn dẹp sạch sẽ 100% credit cũ**.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly hoặc 3uTools.
          files: J2ME-Decade.ipa

