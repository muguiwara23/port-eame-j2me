name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.18-native
          name: "Vạn Trần J2ME Native iOS v2.18"
          body: |
            ## Vạn Trần J2ME iOS v2.18 — Giao Diện "Chơi Game Tuổi Thơ" & Khắc Phục Triệt Để Đơ Màn Hình Khi Treo Lâu
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🎮 **Giao Diện "Chơi Game Tuổi Thơ" Hiện Đại (Chuẩn 1:1 Theo Ảnh Mẫu)**:
              - **Thẻ Game Card Tinh Tế**: Hiển thị đầy đủ thông tin game, phiên bản, dung lượng (`v1.6.12 • 1.7 MB`), nhãn tỷ lệ màn hình `[🔲] Tự Động`.
              - **Trạng Thái Đang Chạy Sống Động**: Huy hiệu `🟢 Đang Chạy` (xanh lá cây) khi game đang chạy ngầm 24/7 và `⚪️ Đã Dừng` (xám) khi chưa chạy.
              - **Tiêu đề đếm số game**: `Đang Chạy: X / Y Game` cập nhật theo thời gian thực.
              - **Khôi phục game mượt mà**: Bấm vào game đang chạy sẽ lập tức khôi phục màn hình chơi game mà không bị khởi động lại từ đầu.
              - **Thanh Điều Hướng 5 Tab Hiện Đại**: `Kho Game`, `Treo 24/7`, `Đang Chạy` (kèm số thông báo đỏ đếm game đang chạy), `Tài Khoản`, `Cài Đặt`.
            - 🛡️ **Khắc Phục Triệt Để Hiện Tượng Đơ Màn Hình Khi Mở Khóa / Treo Lâu**:
              - **Tự động ép vẽ lại màn hình (Force Canvas Repaint)**: Khi mở khóa màn hình hoặc chuyển từ chế độ chạy ngầm sang màn hình sáng, giả lập lập tức kích hoạt vẽ lại toàn bộ khung hình Java Canvas mới nhất, xóa bỏ triệt để hiện tượng đơ hình ảnh cũ.
              - **Đồng bộ trạng thái ứng dụng Active**: Bổ sung cơ chế giám sát `didBecomeActiveNotification` để khôi phục render đồ hoạ ngay cả khi người dùng gạt thanh thông báo hoặc vuốt mở khóa.
              - **Treo ngầm mượt mà không văng**: Hỗ trợ tính năng "Ẩn & Treo ngầm (Giữ game chạy 24/7)" khi bấm nút Quay lại (Back), giữ game chạy thông suốt trong nền.
            - 📍 **Chế Độ Treo Định Vị BTS Tiết Kiệm Pin Tối Đa (0% Pin, Không Cần Audio)**:
              - Giữ kết nối ngầm bằng trạm sóng BTS di động (`kCLLocationAccuracyThreeKilometers`), TẮT HOÀN TOÀN chip GPS vệ tinh và audio keepalive giúp máy mát lạnh.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

