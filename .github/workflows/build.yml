name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.20-native
          name: "Vạn Trần J2ME Native iOS v2.20"
          body: |
            ## Vạn Trần J2ME iOS v2.20 — Giữ Kết Nối Mạng 24/24 Không Bị Ngắt & Giữ App Hoạt Động Liên Tục Không Ngừng Nghỉ
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🌐 **Hệ Thống Giữ Kết Nối Mạng 24/24 Không Ngắt Nghỉ (Quad-Shield Network & Process Keeper)**:
              - **Chống Wi-Fi ngủ đông khi khóa màn hình (Anti-WiFi Sleep)**: iOS có cơ chế đưa chip Wi-Fi vào chế độ ngủ (Power-Save Sleep) sau 2-5 phút khóa máy. Module `DecadeNetworkKeeper` phát xung heartbeat siêu nhẹ (HEAD/204 không tốn dung lượng) mỗi 15 giây, giữ module Wi-Fi thức 24/24 để game liên tục nhận gói tin từ server máy chủ.
              - **Chống nhà mạng (4G/5G) ngắt cổng NAT (Anti-CGNAT Idle Timeout Drop)**: Thiết lập socket Darwin TCP Keepalive thăm dò mỗi 15 giây, chu kỳ 10 giây và chịu lỗi 30 lần (`decade_network_optimize_socket`), chống hoàn toàn việc nhà mạng (Viettel, Vina, Mobi) hủy phiên kết nối khi game đứng yên auto-farm.
              - **Chạy song hành Audio Bất Tử + Định Vị BTS + Background Task**: Treo ngầm giờ đây luôn duy trì pipeline âm thanh kép vô hình (`mediaserverd` cấp miễn trừ đóng băng 24/24 tuyệt đối) song hành cùng định vị trạm sóng BTS và background task tự động gia hạn, bảo đảm ứng dụng không bao giờ bị iOS tạm dừng (suspend).
              - **Bổ sung Background Fetch & Background Processing trong Info.plist**: Tối ưu hóa tối đa các chế độ nền được cấp phép trên iOS.
              - **Giám sát mạng thời gian thực (NWPathMonitor)**: Tự động thích ứng khi chuyển đổi giữa Wi-Fi và 4G/5G mà không làm rớt socket.
            - 🛡️ **Kèm Đầy Đủ Các Bản Vá Ổn Định v2.19**:
              - Triệt tiêu hoàn toàn GC Deadlock Stop-The-World và lỗi treo đơ 17% CPU sau 57 phút.
              - Cơ chế dọn RAM an toàn và ghim thẻ thông tin trạng thái RAM/CPU/Tab/Mạng chuẩn như GaEmulator.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

