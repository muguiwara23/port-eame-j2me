name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Compile and Package j2me_api.jar
        run: |
          echo "=== Compiling j2me_api.jar ==="
          cd j2me_api
          rm -rf classes sources.txt
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac --release 8 -cp "../J2MEEmulator/Resources/jars/minijvm_rt.jar" -d classes @sources.txt
          jar cf "../J2MEEmulator/Resources/jars/j2me_api.jar" -C classes .
          rm -rf classes sources.txt
          cd ..
          ls -lh J2MEEmulator/Resources/jars/j2me_api.jar

      - name: Build Application with Xcode
        run: |
          set -o pipefail
          xcodebuild -project J2MEEmulator.xcodeproj \
            -target J2MEEmulator \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build_out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build 2>&1 | tee build_raw.log || {
              echo "=== BUILD FAILED - RECENT LOGS ==="
              tail -n 120 build_raw.log
              exit 1
            }

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$PWD/build_out" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          cp -v J2MEEmulator/Resources/silent.wav Payload/*.app/ || true
          echo "=== Content of App Bundle ==="
          ls -la Payload/*.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.12-native
          name: "Vạn Trần J2ME Native iOS v2.12"
          body: |
            ## Vạn Trần J2ME iOS v2.12 — Sửa Triệt Để Kín Màn Hình Tự Động Không Méo & Bật Tắt Viền Đen
            - **Tác giả**: **Vạn Trần idol J2me NSV IOS**
            - 🖥️ **Kích Thước Màn Hình "Tự Động" Kín 100% Khung Hình, Không Méo, Không Viền Đen**:
              - Sửa công thức tính kích thước "Tự Động": Khớp chính xác tỷ lệ vùng hiển thị thực tế của game sau khi trừ đi thanh công cụ trên và bàn phím ảo bên dưới (không còn bị tính nhầm theo toàn bộ chiều cao máy dẫn đến co rúm hình thành vệt hẹp ở giữa).
              - Tích hợp công tắc **"Kín Màn Hình (Không Viền Đen)"** trong Cài Đặt Game: Tự động co giãn toàn bộ đồ họa vừa khít mép màn hình thiết bị, loại bỏ 100% khoảng đen hai bên.
              - Tự động phát hiện và cập nhật kích thước tức thì: Khi đổi kích thước hoặc chọn Tự Động trong cài đặt, game tự áp dụng và khởi động lại phiên chơi ngay lập tức không bị giữ lại độ phân giải cũ.
              - Nhớ chính xác trạng thái Ẩn/Hiện bàn phím ảo theo từng game khi khởi động.
            - 📌 **Thẻ Trạng Thái Ghim Cố Định Trên Màn Hình Khóa / Thanh Thông Báo (NowPlaying Card)**:
              - Thẻ trạng thái RAM, CPU, Tab, Giờ cập nhật chuẩn phong cách dark card cao cấp hiển thị cố định, tự động cập nhật số liệu thời gian thực.
              - **Triệt để chấm dứt hiện tượng rơi/nhảy banner thông báo liên tục**: Cập nhật hoàn toàn êm ái qua `MPNowPlayingInfoCenter`, không spam banner, không làm phiền khi đang dùng máy khác hay lướt web.
            - 🎨 **Đồ Họa & Render Ổn Định 120 FPS**:
              - Khóa cân bằng tầng vẽ CoreGraphics GState (depth = 1), không còn hiện tượng méo ảnh, lộn ngược hoặc đứng hình khi vẽ clip rect phức tạp.
            - ⚡ **Treo Nền 24/7 Xuyên Ngày Tháng**:
              - Bộ giữ nhịp âm thanh tần số thấp vô thanh 18Hz kết hợp Watchdog tự động phục hồi kết nối.
              - Cơ chế dọn dẹp RAM định kỳ (Auto Clean RAM) chống Jetsam kill khi treo dài hạn.
            - **Cài đặt**: Tải file `J2ME-Decade.ipa` bên dưới rồi cài qua Sideloadly, TrollStore hoặc 3uTools.
          files: J2ME-Decade.ipa

